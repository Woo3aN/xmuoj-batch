name: Build VSIX

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @vscode/vsce
      - run: vsce package
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
